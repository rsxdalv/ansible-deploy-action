# Reusable workflow: build an app image with its deploy/ folder (Podman Quadlet unit files) embedded,
# push it to zot and deploy it on the host through the ansible-hooks `quadlet-apply` service.
# The repo needs no secrets and no entry in ansible-hooks: each deploy waits for an approval in the
# ansible.ttswebui.com dashboard (or goes straight through once the repo is set to "approve all future").
#
# Caller (.github/workflows/deploy.yml in the app repo):
#
#   name: deploy
#   on:
#     push: {branches: [main]}
#     pull_request: {branches: [main]}
#     workflow_dispatch:
#   jobs:
#     deploy:
#       uses: rsxdalv/ansible-deploy-action/.github/workflows/quadlet-apply.yml@v3
#       permissions: {contents: read, id-token: write}
#
# App repo layout: Dockerfile + deploy/service.yml (`unit: <main unit>`) + deploy/<unit>.container
# (plain or .j2; `{{ image_ref }}` is replaced with the deployed image) and any extra .network /
# .volume / .pod / .timer files, optional deploy/secrets.sops.yaml (-> podman secrets <prefix>_<KEY>).
# Multi-image repos: one job per app with `app: <name>` (image <repo>/<name>) and its own deploy-dir.
# Pull requests only build. Pushes to main build, push and deploy.
name: quadlet-apply

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Dockerfile path (relative to the repo root)
        type: string
        default: Dockerfile
      deploy-dir:
        description: Folder holding service.yml and the Quadlet files (embedded as the dev.ttswebui.deploy label)
        type: string
        default: deploy
      app:
        description: Optional app name inside a multi-image repo (image <repo>/<app>)
        type: string
        default: ''
      build-args:
        description: Docker build args (newline-separated KEY=value)
        type: string
        default: ''
      webhook-url:
        description: ansible-hooks base URL
        type: string
        default: https://ansible.ttswebui.com
      registry:
        type: string
        default: registry.dev.ttswebui.com

permissions:
  contents: read
  id-token: write

jobs:
  quadlet-apply:
    runs-on: ubuntu-latest
    concurrency:
      group: quadlet-apply-${{ github.repository }}-${{ inputs.app }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check and bundle deploy/
        id: bundle
        env:
          DEPLOY_DIR: ${{ inputs.deploy-dir }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          [ -f "$DEPLOY_DIR/service.yml" ] || { echo "::error::$DEPLOY_DIR/service.yml is missing (unit: <main unit name>)"; exit 1; }
          unit=$(python3 -c 'import sys, yaml; d = yaml.safe_load(open(sys.argv[1])); print(d["unit"])' "$DEPLOY_DIR/service.yml")
          [ -f "$DEPLOY_DIR/$unit.container" ] || [ -f "$DEPLOY_DIR/$unit.container.j2" ] \
            || { echo "::error::$DEPLOY_DIR/$unit.container(.j2) is missing"; exit 1; }
          if [ -n "$APP" ] && ! [[ "$APP" =~ ^[a-z0-9][a-z0-9-]{0,30}$ ]]; then echo "::error::app must be a short lowercase name"; exit 1; fi
          if [ -f "$DEPLOY_DIR/secrets.sops.yaml" ] && ! grep -q 'ENC\[' "$DEPLOY_DIR/secrets.sops.yaml"; then
            echo "::error::$DEPLOY_DIR/secrets.sops.yaml is not SOPS-encrypted"; exit 1
          fi
          # Reproducible archive: same deploy/ -> same label -> same image digest.
          parent=$(dirname "$DEPLOY_DIR"); base=$(basename "$DEPLOY_DIR")
          b64=$(tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
                  --transform "s|^$base|deploy|" -C "$parent" -cf - "$base" | gzip -n | base64 -w0)
          [ ${#b64} -lt 390000 ] || { echo "::error::deploy/ bundle too large (${#b64} bytes base64)"; exit 1; }
          echo "label=$b64" >> "$GITHUB_OUTPUT"
          echo "image=${{ inputs.registry }}/${GITHUB_REPOSITORY,,}${APP:+/$APP}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to zot with an OIDC token
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY}" | jq -r '.value')
          [ -n "$token" ] && [ "$token" != "null" ] || { echo "no OIDC token returned" >&2; exit 1; }
          echo "::add-mask::$token"
          printf '%s' "$token" | docker login "$REGISTRY" -u oauth --password-stdin

      - name: Build (push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.bundle.outputs.image }}:${{ github.sha }}
            ${{ steps.bundle.outputs.image }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dev.ttswebui.deploy=${{ steps.bundle.outputs.label }}

      - name: Deploy on the host (quadlet-apply, by digest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: rsxdalv/ansible-deploy-action@v1
        with:
          webhook-url: ${{ inputs.webhook-url }}
          service: quadlet-apply
          package: ${{ inputs.app }}
          version: ${{ steps.build.outputs.digest }}
